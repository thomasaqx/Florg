services:
  db:
    image: postgres:16-alpine
    container_name: florg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: florg
      POSTGRES_PASSWORD: florg
      POSTGRES_DB: florg
    ports:
      - "5432:5432"
    volumes:
      - florg_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florg"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: florg_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  florg_db_data:
