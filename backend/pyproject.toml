[project]
name = "florg-backend"
version = "0.1.0"
description = "Backend do FLORG - organizador financeiro pessoal (TCC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.1",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",  # ClaudeProvider chama a API da Anthropic
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
